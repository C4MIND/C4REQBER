# Mirror-only light checks. Canonical CI is GitLab (.gitlab-ci.yml).
# Full pytest / coverage gates do NOT run here — they red-flag the
# promotion mirror without reflecting product health.

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: TUI v9 tests
        working-directory: src/tui/v9
        run: go test ./... -count=1
